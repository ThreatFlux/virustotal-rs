version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"
    groups:
      development-dependencies:
        patterns:
          - "tokio-test"
          - "mockito"
          - "wiremock"
          - "clap"
        update-types:
          - minor
          - patch
      security-dependencies:
        patterns:
          - "reqwest"
          - "rustls*"
          - "openssl*"
          - "ring"
        update-types:
          - patch
      async-dependencies:
        patterns:
          - "tokio*"
          - "async-*"
          - "futures*"
        update-types:
          - minor
          - patch
    ignore:
      # Major versions change public types; they are upgraded by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
