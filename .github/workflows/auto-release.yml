name: Auto Release

concurrency:
  # Dry runs use their own group so they never cancel a real release.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

# workflow_run only gates the release on CI and Security for main. The
# reusable workflow releases nothing unless the triggering run succeeded in
# this repository (not a fork) and every required workflow passed for that
# exact commit, and it never runs pull request code.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, or release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@eb9f3cf78c3899be0c4c9323d5cc86de5e1fdee8 # v0.7.7
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      required-workflows: CI,Security
      # The threatflux-automation App cuts the release, so its tag push starts
      # release.yml (on: push: tags) by itself and the reusable workflow skips
      # this dispatch. The dispatch only runs when no App is configured and
      # the release is cut with GITHUB_TOKEN, whose tag push starts nothing.
      dispatch-workflows: release.yml
      dispatch-version-workflow: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
