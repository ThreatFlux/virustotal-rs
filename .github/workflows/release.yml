name: Release

# Read-only by default; only the jobs that create the tag/release or upload
# release assets get contents: write, and only the publish job gets id-token.
permissions:
  contents: read

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 0.5.1)
        required: true
        type: string
      source_ref:
        description: Git ref to build from (defaults to the ref the workflow runs on)
        required: false
        type: string
      prerelease:
        description: Mark this release as a prerelease (skips crates.io)
        required: false
        type: boolean
        default: false
      dry_run:
        description: Build, package and verify without tagging, releasing or publishing
        required: false
        type: boolean
        default: false

# Real runs for one version are serialized, so a tag push and a dispatch for
# the same tag never race; every dry run gets its own group.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && format('dry-run-{0}', github.run_id) || format('v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.99.0
  CRATE_NAME: virustotal-rs
  # Only workflow_dispatch can set this; tag pushes always perform a real release.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creates the release tag and the GitHub Release.
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source_sha.outputs.source_sha }}
    steps:
      - name: Determine source ref
        id: source_ref
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_SOURCE_REF" ]]; then
            SOURCE_REF="$INPUT_SOURCE_REF"
          else
            SOURCE_REF="${GITHUB_REF}"
          fi
          if [[ "$SOURCE_REF" == *$'\n'* || "$SOURCE_REF" == *$'\r'* ]]; then
            echo "Source ref must be one line" >&2
            exit 1
          fi
          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.source_ref.outputs.source_ref }}

      # Resolve the ref once; the tag and every downstream job use this exact
      # commit, so a moving branch cannot make assets differ from the tag.
      - name: Resolve source commit
        id: source_sha
        run: echo "source_sha=$(git rev-parse --verify HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The crate is published at its Cargo.toml version, so a release must
      # match it. A dry run may rehearse a version that is not bumped yet, so
      # it only warns.
      - name: Check manifest version
        id: manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MANIFEST_VERSION="$(python3 -c 'import tomllib; v = tomllib.load(open("Cargo.toml", "rb")).get("package", {}).get("version"); print(v if isinstance(v, str) else "")')"
          echo "version=${MANIFEST_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::warning::Cargo.toml version ${MANIFEST_VERSION} does not match release version ${VERSION}; the dry run packages and verifies ${MANIFEST_VERSION}"
            else
              echo "Cargo.toml version ${MANIFEST_VERSION} does not match release version ${VERSION}" >&2
              exit 1
            fi
          fi

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          printf '## Release %s\n\n' "${TAG}" > release_notes.md
          # Body of the "## [VERSION]" CHANGELOG section, up to the next "## "
          # heading or the link reference definitions at the end of the file.
          if [[ -f CHANGELOG.md ]]; then
            awk -v header="## [${VERSION}]" '
              !found && index($0, header) == 1 { found = 1; next }
              !found { next }
              /^## / || /^\[.*\]: / { exit }
              !started && /^[[:space:]]*$/ { next }
              { started = 1; print }
            ' CHANGELOG.md > changelog_section.md
          fi
          if [[ -s changelog_section.md ]]; then
            cat changelog_section.md >> release_notes.md
          else
            PREVIOUS_TAG="$(git tag --merged HEAD --sort=-version:refname --list 'v*' | grep -vx "${TAG}" | head -n 1 || true)"
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
            else
              git log --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
            fi
            echo >> release_notes.md
          fi

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.source_sha }}
        run: |
          echo "Dry run: building ${SOURCE_SHA} as v${VERSION} without creating or checking the tag or release"
          {
            echo "### Release dry run: v${VERSION}"
            echo
            echo "Source commit: \`${SOURCE_SHA}\`. No tag, GitHub Release, release assets or crates.io package is published."
            echo
            echo "Cargo.toml version packaged and verified: \`${MANIFEST_VERSION:-unknown}\`."
            echo
            cat release_notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.source_sha }}
          INPUT_PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          TITLE="VirusTotal Rust SDK ${TAG}"
          IS_PRERELEASE="false"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_PRERELEASE" == "true" ]]; then
            IS_PRERELEASE="true"
          fi
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi

          # An existing tag is never moved, so refuse to build or publish a
          # different commit under it (checkout fetched all tags).
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            if ! TAG_SHA="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
              echo "Tag ${TAG} does not point to a commit" >&2
              exit 1
            fi
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "Tag ${TAG} points to ${TAG_SHA}, not the selected source commit ${SOURCE_SHA}" >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Create the tag before any release is published. Ref creation is
            # atomic, so if a concurrent run or a manual push created it first,
            # this fails and the check below compares against that tag.
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SOURCE_SHA}" >/dev/null || true
          else
            echo "Missing expected release tag ${TAG}" >&2
            exit 1
          fi

          # The tag on GitHub, not the checkout snapshot, decides the release.
          REMOTE_TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha)"
          if [[ "$REMOTE_TAG_SHA" != "$SOURCE_SHA" ]]; then
            echo "Tag ${TAG} points to ${REMOTE_TAG_SHA} on GitHub, not the selected source commit ${SOURCE_SHA}" >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Keep the notes auto-release or a maintainer already wrote.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE"
          else
            PRERELEASE_FLAG=()
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              PRERELEASE_FLAG=(--prerelease)
            fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TITLE" \
              --notes-file release_notes.md "${PRERELEASE_FLAG[@]}"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-musl-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            use_cross: true
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-amd64
    runs-on: ${{ matrix.os }}
    # Build scripts use bash syntax; Windows otherwise defaults to pwsh.
    # Package (Windows) opts back into pwsh explicitly.
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: virustotal-rs-${{ needs.prepare.outputs.version }}-${{ matrix.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      # vt-cli and mcp_server are built with their own features, exactly as
      # `cargo install --features cli|mcp` builds them.
      - name: Build binaries
        env:
          BUILDER: ${{ matrix.use_cross && 'cross' || 'cargo' }}
        run: |
          set -euo pipefail
          "${BUILDER}" build --locked --release --target "${TARGET}" --features cli --bin vt-cli
          "${BUILDER}" build --locked --release --target "${TARGET}" --features mcp --bin mcp_server

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp LICENSE LICENSE-APACHE README.md dist/
          cp "target/${TARGET}/release/vt-cli" "target/${TARGET}/release/mcp_server" dist/
          tar czf "${ARCHIVE}.tar.gz" -C dist .
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item LICENSE, LICENSE-APACHE, README.md dist/
          Copy-Item "target/${env:TARGET}/release/vt-cli.exe", "target/${env:TARGET}/release/mcp_server.exe" dist/
          $archive = "${env:ARCHIVE}.zip"
          Compress-Archive -Path dist/* -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: |
            ${{ env.ARCHIVE }}.tar.gz*
            ${{ env.ARCHIVE }}.zip*
          if-no-files-found: error
          retention-days: 5

  sbom:
    name: Generate Release SBOM
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cargo cyclonedx --all-features --format json --target all --override-filename "${CRATE_NAME}-v${VERSION}.cdx"
          test -s "${CRATE_NAME}-v${VERSION}.cdx.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: ${{ env.CRATE_NAME }}-v${{ needs.prepare.outputs.version }}.cdx.json
          if-no-files-found: error
          retention-days: 5

  upload-assets:
    name: Upload Release Assets
    needs: [prepare, build, sbom]
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write # Uploads the release assets.
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: release-*

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for file in artifacts/**/*; do
            if [[ -f "$file" ]]; then
              gh release upload "v${VERSION}" "$file" --repo "$GITHUB_REPOSITORY" --clobber
            fi
          done

  publish:
    name: Publish to crates.io
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # Real publishes skip prereleases (a version suffix such as 1.2.3-rc1, or the
    # prerelease dispatch input); a dry run always runs `cargo publish --dry-run`.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.dry_run) ||
      (!contains(needs.prepare.outputs.version, '-') &&
      !(github.event_name == 'workflow_dispatch' && inputs.prerelease))
    # crates.io trusted publishing trusts this workflow file (release.yml) in the
    # crates-io environment. A dry run gets an empty environment name, which runs
    # the job without an environment, so it records no deployment.
    environment:
      name: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'crates-io' || '' }}
    permissions:
      contents: read
      id-token: write # Exchanged for a short-lived crates.io token; no registry secret is used.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Verify package
        run: |
          cargo package --locked --all-features
          cargo package --locked --list

      - name: Verify crates.io package (dry run)
        if: env.DRY_RUN == 'true'
        run: cargo publish --all-features --locked --dry-run

      # crates.io versions are immutable, so a rerun (or a second run for the
      # same tag) skips a version that is already published instead of failing.
      - name: Check crates.io for this version
        id: pending
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er --arg name "${CRATE_NAME}" '.packages[] | select(.name == $name) | .version')"
          status="$(curl --silent --show-error --retry 3 --retry-all-errors \
            --user-agent "${GITHUB_REPOSITORY}-release/${GITHUB_RUN_ID} (https://github.com/${GITHUB_REPOSITORY})" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${VERSION}")"
          case "${status}" in
            200)
              echo "::notice::${CRATE_NAME} ${VERSION} is already on crates.io; skipping it"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "crates.io returned HTTP ${status} for ${CRATE_NAME} ${VERSION}" >&2
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        id: crates-io-auth
        if: env.DRY_RUN != 'true' && steps.pending.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: env.DRY_RUN != 'true' && steps.pending.outputs.publish == 'true'
        env:
          # Short-lived trusted-publishing token; the auth action revokes it
          # in its post step. No long-lived registry secret is read.
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --all-features --locked
