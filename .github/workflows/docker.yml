name: MCP Container

on:
  pull_request:
    branches: [main]
    paths: [Dockerfile, .dockerignore, Cargo.toml, Cargo.lock, rust-toolchain.toml, 'src/**', 'scripts/**', .github/workflows/docker.yml]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

jobs:
  container:
    name: MCP ${{ matrix.arch }}
    # The release tag builds the release commit; avoid duplicate main/tag work.
    if: >-
      !(github.event_name == 'push' && github.ref_type == 'branch' &&
      startsWith(github.event.head_commit.message, 'chore: release v'))
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate dispatched release and run container-check regressions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/container_publish_tags.py --validate
          if [[ "$REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main || {
              echo "Release tags must identify a commit already merged into main." >&2
              exit 1
            }
          fi
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build complete MCP server with all authentication features
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: vt-mcp:scan
          cache-from: type=gha,scope=mcp-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mcp-${{ matrix.arch }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ steps.checkout.outputs.commit }}
      - name: Verify static provenance and real MCP authentication/transports
        run: |
          python3 scripts/check_static_image.py vt-mcp:scan
          python3 scripts/smoke_mcp_container.py vt-mcp:scan
          python3 scripts/smoke_mcp_https.py vt-mcp:scan
      - name: Scan all OS and Cargo severities
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: vt-mcp:scan
          format: sarif
          output: trivy-results.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          vuln-type: os,library
          exit-code: '1'
      # The old published image used this non-matrix analysis identity. Only
      # amd64 succeeds that identity; ARM has its own independent analysis.
      - name: Upload AMD64 results preserving historical analysis identity
        if: always() && matrix.arch == 'amd64' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        env:
          CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/auto-release.yml:docker-scan
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/auto-release.yml:docker-scan
          matrix: '{}'
      - name: Upload independent ARM64 results
        if: always() && matrix.arch == 'arm64' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: mcp-container-arm64
      - name: Require clean scan before publishing
        if: steps.scan.outcome != 'success'
        run: exit 1
      - name: Registry login
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact tested platform image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
        env:
          IMAGE: ghcr.io/threatflux/virustotal-rs-mcp
          SHA: ${{ steps.checkout.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag vt-mcp:scan "${IMAGE}:${SHA}-${ARCH}"
          docker push "${IMAGE}:${SHA}-${ARCH}"
  manifest:
    needs: container
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multi-platform index
        env:
          IMAGE: ghcr.io/threatflux/virustotal-rs-mcp
          SHA: ${{ steps.checkout.outputs.commit }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags_output=$(python3 scripts/container_publish_tags.py)
          mapfile -t tags <<< "$tags_output"
          docker buildx imagetools create "${tags[@]}" "${IMAGE}:${SHA}-amd64" "${IMAGE}:${SHA}-arm64"

  latest:
    needs: manifest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    # Only this short job writes latest. Canceled pending updates are safe:
    # every surviving updater promotes the current main image, not its own SHA.
    concurrency:
      group: mcp-container-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only the tested current main index
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/threatflux/virustotal-rs-mcp
        run: |
          main_head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          source=$(python3 scripts/container_publish_tags.py --latest --main-head "$main_head")
          if ! docker buildx imagetools inspect "$source" > /dev/null 2> manifest-error.txt; then
            if grep -Eq 'manifest unknown|not found' manifest-error.txt; then
              echo "Current main has no completed, tested image yet; its publication will update latest."
              exit 0
            fi
            cat manifest-error.txt >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "$source"
